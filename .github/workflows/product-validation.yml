name: product-validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: product-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    environment: tabellio-checkpoint-proof
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: {node-version: 22.23.1, package-manager-cache: false}
      - name: Enable local PostgreSQL binaries for isolated provenance validation
        run: |
          postgres_bin="$(pg_config --bindir)"
          test -x "$postgres_bin/initdb"
          test -x "$postgres_bin/pg_ctl"
          echo "$postgres_bin" >> "$GITHUB_PATH"
      - name: Install pinned security scanners
        run: bash .buildkite/scripts/security-tools.sh
      - name: Install checksum-verified Entire 0.7.7
        run: bash .buildkite/scripts/entire-tools.sh
      - name: Resolve squash-merge checkpoint revision
        id: checkpoint
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          MERGED_COMMIT: ${{ github.sha }}
        run: |
          set -o pipefail
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/$GITHUB_REPOSITORY/commits/$MERGED_COMMIT/pulls" \
            | node scripts/resolve-merged-checkpoint.mjs \
                --commit "$MERGED_COMMIT" \
                --github-output "$GITHUB_OUTPUT"
      - name: Fetch squash-merge checkpoint revision
        if: github.event_name == 'push' && steps.checkpoint.outputs.found == 'true'
        env:
          CHECKPOINT_FETCH_REF: ${{ steps.checkpoint.outputs.fetch_ref }}
          CHECKPOINT_LOCAL_REF: ${{ steps.checkpoint.outputs.local_ref }}
          CHECKPOINT_EXPECTED_HEAD: ${{ steps.checkpoint.outputs.head }}
        run: |
          git fetch --no-tags origin "+$CHECKPOINT_FETCH_REF:$CHECKPOINT_LOCAL_REF"
          actual_head="$(git rev-parse "$CHECKPOINT_LOCAL_REF^{commit}")"
          test "$actual_head" = "$CHECKPOINT_EXPECTED_HEAD"
      - name: Load approved exact-candidate checkpoint evidence
        env:
          TABELLIO_CHECKPOINT_PROOF_1: ${{ secrets.TABELLIO_CHECKPOINT_PROOF_1 }}
          TABELLIO_CHECKPOINT_PROOF_2: ${{ secrets.TABELLIO_CHECKPOINT_PROOF_2 }}
        run: node scripts/ci-checkpoint-evidence.mjs load
      - name: Validate exact candidate
        env:
          CHECKPOINT_FOUND: ${{ steps.checkpoint.outputs.found }}
          CHECKPOINT_HEAD: ${{ steps.checkpoint.outputs.head }}
        run: |
          set -o pipefail
          umask 077
          private_dir="$(mktemp -d)"
          trap 'rm -rf "$private_dir"' EXIT
          base_ref=origin/main
          checkpoint_args=()
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            base_ref=HEAD^
            if [ "$CHECKPOINT_FOUND" = "true" ]; then
              checkpoint_args=(--checkpoint-base "$base_ref" --checkpoint-head "$CHECKPOINT_HEAD")
            fi
          fi
          install -m 755 scripts/tabellio-validator.mjs "$RUNNER_TEMP/tabellio-validator"
          if ! PATH="$RUNNER_TEMP:$PATH" node scripts/tabellio-validate.mjs gate \
            --repo . \
            --repo-id "github.com/$GITHUB_REPOSITORY" \
            --runner-id "github:$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT" \
            --base "$base_ref" \
            --commit HEAD \
            "${checkpoint_args[@]}" \
            --manifest tabellio.validation.json > "$private_dir/tabellio-validation-private.json" 2> "$private_dir/validation-stderr.log"; then
            node scripts/validation-public-summary.mjs "$private_dir/tabellio-validation-private.json" tabellio-validation-result.json
            echo "Product validation failed; inspect the trusted worker result. Missing genuine checkpoint evidence must fail the gate." >&2
            exit 1
          fi
          node scripts/validation-public-summary.mjs "$private_dir/tabellio-validation-private.json" tabellio-validation-result.json
      - name: Publish safe validation summary without artifact storage
        if: always()
        run: |
          if [ -f tabellio-validation-result.json ]; then
            cat tabellio-validation-result.json
            cat tabellio-validation-result.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Product validation blocked before a safe result was produced.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Remove private checkpoint runner files
        if: always()
        run: node scripts/ci-checkpoint-evidence.mjs cleanup
